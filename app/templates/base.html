<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vendor onboarding{% endblock %}</title>
  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           margin: 0; background: var(--bg); color: var(--fg); line-height: 1.5; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
    h2 { font-size: 15px; font-weight: 600; margin: 32px 0 8px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-weight: 500; color: var(--muted);
         border-bottom: 1px solid var(--line); padding: 8px 10px; }
    td { border-bottom: 1px solid var(--line); padding: 10px; }
    a { color: #1a5fb4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 11px;
            font-size: 12px; font-weight: 500; }
    .approved      { background:#e6f4ea; color:#137333; }
    .pending_info  { background:#fef7e0; color:#a06000; }
    .needs_review  { background:#fce8e6; color:#b3261e; }
    .rejected      { background:#f1f1f1; color:#3c3c3c; }
    .block { background:#fce8e6; color:#b3261e; }
    .review { background:#fce8e6; color:#b3261e; }
    .require_info { background:#fef7e0; color:#a06000; }
    .warn { background:#f1f3f4; color:#5f6368; }
    .info { background:#f1f3f4; color:#5f6368; }
    .finding { border: 1px solid var(--line); border-radius: 6px;
               padding: 12px 14px; margin-bottom: 10px; }
    .rule { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
            color: var(--muted); }
    .remedy { color: var(--muted); font-size: 13px; margin-top: 6px;
              padding-left: 10px; border-left: 2px solid var(--line); }
    pre { background:#fafafa; border:1px solid var(--line); border-radius:6px;
          padding: 12px; overflow-x: auto; font-size: 12.5px;
          white-space: pre-wrap; }
    .step { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .ms { color: var(--muted); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body><div class="wrap">{% block body %}{% endblock %}</div></body>
</html>
